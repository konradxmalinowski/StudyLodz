name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate website/*.html

      - name: Check internal anchor links resolve
        run: |
          for f in website/*.html; do
            for anchor in $(grep -oE 'href="#[a-zA-Z0-9_-]+"' "$f" | sed -E 's/href="#(.*)"/\1/'); do
              if ! grep -qE "id=\"$anchor\"" "$f"; then
                echo "Broken anchor #$anchor in $f"
                exit 1
              fi
            done
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
